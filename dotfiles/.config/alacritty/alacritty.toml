[window]
padding = { x = 8, y = 6 }
dynamic_padding = true
opacity = 1.0

[font]
size = 12.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[colors.primary]
background = "#0a0c16"
foreground = "#c8d3f5"

[colors.cursor]
text = "#0a0c16"
cursor = "#00f5c8"

[colors.selection]
text = "#c8d3f5"
background = "#2a2f45"

[colors.normal]
black = "#1f2335"
red = "#ff2e63"
green = "#00f5c8"
yellow = "#ffe66d"
blue = "#4d8dff"
magenta = "#ff6ad5"
cyan = "#5ef6ff"
white = "#c8d3f5"

[colors.bright]
black = "#414868"
red = "#ff4d6d"
green = "#5bffd8"
yellow = "#ff9e64"
blue = "#7ab8ff"
magenta = "#c77dff"
cyan = "#22e1ff"
white = "#ffd7f5"

[selection]
save_to_clipboard = true

[terminal.shell]
program = "/usr/bin/zsh"
args = ["-l"]
