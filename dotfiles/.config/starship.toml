[username]
#show_always = true
#style_user = "bg:surface0 fg:text"
#style_root = "bg:surface0 fg:text"
#format = '[ $user ]($style)'

[env_var.container]
# EXEGOL_CONTAINER is exported by the exegol zshrc as $HOSTNAME minus "exegol-".
# Falls back to "Exegol" if the variable isn't set (e.g. non-exegol shell).
variable = "EXEGOL_CONTAINER"
default = "Exegol"
style = "bold pink"
format = "[$env_value]($style)"

[directory]
style = "sapphire"
format = "[ $path ]($style)"
#truncation_length = 4
#truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[os]
disabled = true
#style = "bg:surface0 fg:text"

[custom.giturl]
# disabled = true
description = "Display symbol for remote Git server"
command = """
GIT_REMOTE=$(command git ls-remote --get-url 2> /dev/null)
if [[ "$GIT_REMOTE" =~ "github" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "gitlab" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "bitbucket" ]]; then
    GIT_REMOTE_SYMBOL=" "
elif [[ "$GIT_REMOTE" =~ "git" ]]; then
    GIT_REMOTE_SYMBOL=" "
else
    GIT_REMOTE_SYMBOL=" "
fi
echo "$GIT_REMOTE_SYMBOL "
"""
when = 'git rev-parse --is-inside-work-tree 2> /dev/null'
format = "at $output"

[git_branch]
symbol = "[](black) "
# format =  ' [$symbol$branch(:$remote_branch)]($style)[]'
style = "fg:lavender bg:black"
format =  '  on [$symbol$branch]($style)[](black)'

[git_status]
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = ""
format = '[ $symbol($version) ]($style)'

[c]
symbol = " "
format = '[ $symbol($version) ]($style)'

[rust]
symbol = ""
format = '[ $symbol($version) ]($style)'

[golang]
symbol = ""
format = '[ $symbol($version) ]($style)'
detect_files = ["go.mod"]

[php]
symbol = ""
format = '[ $symbol($version) ]($style)'

[java]
symbol = " "
format = '[ $symbol($version) ]($style)'

[kotlin]
symbol = ""

format = '[ $symbol($version) ]($style)'

[haskell]
symbol = ""

format = '[ $symbol($version) ]($style)'

[python]
disabled = true
symbol = ""

format = '[ $symbol($version) ]($style)'


[docker_context]
symbol = ""
format = '[ $symbol($version) ]($style)'

[time]
disabled = true
time_format = "%R"
style = "bg:peach"
format = '[[  $time ](fg:mantle bg:foam)]($style)'

[line_break]
disabled = true 

[character]
disabled = false
success_symbol = '[𝘹](bold fg:green)'
error_symbol = '[𝘹](bold fg:red)'
vimcmd_symbol = '[](bold fg:creen)'
vimcmd_replace_one_symbol = '[](bold fg:purple)'
vimcmd_replace_symbol = '[](bold fg:purple)'
vimcmd_visual_symbol = '[](bold fg:lavender)'


