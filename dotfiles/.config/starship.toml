command_timeout = 3600
scan_timeout = 1000

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false 

format = """
${env_var.container}\
$directory\
${custom.giturl}\
$git_branch\
$git_state\
$git_status\
$line_break\
$character
"""
right_format = """$python$nodejs$rust$golang$java$php$c$kotlin$haskell$docker_context"""
